plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.gseobi'
version = '0.0.1-SNAPSHOT'
description = 'realtime-caching-gateway'

// Share the selected Boot BOM with library convention scripts.
ext.springBootBom = org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':messaging-application')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Explicit agent avoids unsupported self-attachment in restricted Java 21 environments.
    doFirst {
        def agent = configurations.testRuntimeClasspath.files.find { it.name.startsWith('mockito-core-') }
        jvmArgs "-javaagent:${agent.absolutePath}"
    }
}
