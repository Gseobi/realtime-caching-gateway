name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.engine }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: redis
            image: redis:7.2.7-alpine
            cli: redis-cli
          - engine: valkey
            image: valkey/valkey:8.1.3-alpine
            cli: valkey-cli

    services:
      cache:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd="${{ matrix.cli }} ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: realtime_caching_gateway
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d realtime_caching_gateway"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify cache engine
        env:
          CACHE_CONTAINER: ${{ job.services.cache.id }}
          CACHE_CLI: ${{ matrix.cli }}
        run: |
          docker exec "$CACHE_CONTAINER" "$CACHE_CLI" ping
          docker exec "$CACHE_CONTAINER" "$CACHE_CLI" INFO server

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d realtime_caching_gateway \
            -f src/main/resources/db/migration/init_schema_v1.sql

      - name: Run tests
        run: ./gradlew clean test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.engine }}
          path: |
            build/test-results/test
            build/reports/tests/test

  docker-build:
    name: Docker packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build application image with all modules
        run: docker build --tag realtime-caching-gateway:ci .
